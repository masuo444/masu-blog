<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOMUS Archive — 海外活動記録</title>
<meta name="description" content="枡を持って世界を歩いた活動記録。記事は FOMUS GUILD に移行しました。">
<!-- 記事本体は FOMUS GUILD に移行済み。検索評価をそちらへ集約する -->
<link rel="canonical" href="https://guild.fomus.jp/archive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #f5f0e8; --card: #fffdf8; --ink: #1a1612; --ink-light: #4a4540; --ink-muted: #8a857e; --line: #e3dcd0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; line-height: 1.9;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 48px 32px; max-width: 560px; width: 100%; text-align: center;
  }
  .brand { font-size: 0.7rem; letter-spacing: 0.28em; color: var(--ink-muted); margin-bottom: 18px; }
  h1 { font-family: 'Shippori Mincho', serif; font-size: 1.6rem; font-weight: 600; margin-bottom: 20px; }
  p { color: var(--ink-light); font-size: 0.95rem; margin-bottom: 14px; }
  .en { color: var(--ink-muted); font-size: 0.85rem; }
  .cta {
    display: block; margin: 30px 0 0; padding: 15px 24px; border-radius: 999px;
    background: var(--ink); color: #fff; text-decoration: none; font-weight: 600; font-size: 0.95rem;
    transition: opacity .2s ease;
  }
  .cta:hover { opacity: .82; }
  @media (max-width: 480px) { .card { padding: 36px 22px; } h1 { font-size: 1.35rem; } }
</style>
</head>
<body>
  <main class="card">
    <p class="brand">FOMUS ARCHIVE</p>
    <h1>海外活動記録は<br>FOMUS GUILD へ移りました</h1>
    <p>セブ島、マレーシア、アイルランド、ヨーロッパ、中東、シンガポール、台湾。枡を持って歩いた485本の記録は、FOMUS GUILD で読めます。</p>
    <p class="en">The overseas journal has moved to FOMUS GUILD. All 485 posts are there, in Japanese and English.</p>
    <a class="cta" href="https://guild.fomus.jp/archive" rel="noopener">FOMUS GUILD で読む →</a>
  </main>
</body>
</html>
